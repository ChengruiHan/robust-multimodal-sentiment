[project]
name = "state-msa-q2"
version = "1.0.0"
description = "Competition Q2: state-aware multimodal sentiment prediction"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.1.3",
  "torch==2.5.1",
  "transformers==4.57.6",
  "matplotlib==3.9.2",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu124", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]

[project]
name = "e-q1-submission"
version = "1.0.0"
description = "Traceable word-level multimodal feature extraction"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0,<3",
  "openpyxl>=3.1,<4",
  "torch>=2.8,<2.9",
  "transformers>=4.40,<5",
  "opensmile>=2.5,<3",
  "whisperx>=3.8,<3.9",
  "soundfile>=0.12,<1",
  "matplotlib>=3.8,<4",
  "Pillow>=10,<12",
  "huggingface-hub>=0.30,<1",
  "nltk>=3.9,<4",
]

[tool.uv]
package = false

name: Release verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  utilities:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_docs.py

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.1.3 openpyxl==3.1.5
      - run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m unittest discover -s tests -v
        working-directory: feature_extraction
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
        working-directory: sentiment_model
      - run: python -m unittest discover -s tests -v
        working-directory: explainability
